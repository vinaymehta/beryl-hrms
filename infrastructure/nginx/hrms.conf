# Beryl HRMS — reverse proxy.
#
#   nginx :80/:443  ──┬──►  Next.js   127.0.0.1:3000   (everything else)
#                     └──►  Rails     127.0.0.1:4000   (/api, /rails, /up, …)
#
# Install:
#   sudo cp infrastructure/nginx/hrms.conf /etc/nginx/sites-available/hrms
#   sudo ln -s /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   sudo nginx -t && sudo systemctl reload nginx
#
# Both apps bind to LOOPBACK only. Nothing but nginx should be reachable from
# outside, or the proxy headers below can be spoofed.

upstream hrms_backend {
    server 127.0.0.1:4000 fail_timeout=0;
    keepalive 16;
}

upstream hrms_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
    keepalive 16;
}

# Shared proxy settings. X-Forwarded-Proto is load-bearing: Rails' `assume_ssl`
# and the session cookie's `secure: request.ssl?` both read it. Get it wrong and
# people can log in over HTTP but the cookie is dropped over HTTPS, or the other
# way round — with nothing in the logs to explain it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME — and keep it in step with FRONTEND_ORIGINS and
    # APP_HOST in .env, or mail links and CORS will point at the wrong place.
    server_name hrms.example.com;

    # --- TLS -----------------------------------------------------------------
    # Until a certificate exists, this server block serves plain HTTP and you
    # MUST set FORCE_SSL=false in the backend env. Rails otherwise marks every
    # cookie Secure, browsers silently discard them over HTTP, and nobody can
    # log in. Once certbot has run, uncomment the redirect below, move the
    # locations into a `listen 443 ssl` block, and set FORCE_SSL=true.
    #
    # location / { return 301 https://$host$request_uri; }

    # Resumes, employee documents and appraisal workbooks all upload through
    # here. Rails' own limits are smaller; this just stops nginx rejecting first.
    client_max_body_size 25m;

    # Long enough for a resume parse or an AI call to finish.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # --- Rails ---------------------------------------------------------------
    # /api    — the JSON API.
    # /rails  — Active Storage. production.rb sets
    #           `resolve_model_to_route = :rails_storage_proxy`, so every profile
    #           photo, document download and resume preview is served by RAILS at
    #           /rails/active_storage/... . Route this to the frontend and every
    #           image and download in the product 404s.
    # /up     — health check, for the load balancer or uptime monitor.
    # /sidekiq, /api-docs — admin surfaces Rails mounts itself.
    location ~ ^/(api|rails|up|sidekiq|api-docs)(/|$) {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Streamed downloads (documents, resumes, the appraisal workbook) should
        # start arriving immediately rather than being buffered whole.
        proxy_buffering off;
    }

    # --- Next.js -------------------------------------------------------------
    location / {
        proxy_pass http://hrms_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js uses a websocket for its dev overlay and for any future
        # streaming; harmless in production and required if you ever proxy dev.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Next's build output is content-hashed and immutable.
    location /_next/static/ {
        proxy_pass http://hrms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
