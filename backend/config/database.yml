default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5442) %>
  username: <%= ENV.fetch("DATABASE_USER", "hr_platform") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "hr_platform_dev_password") %>
  # Must stay >= Puma's thread count (config/puma.rb defaults to the same
  # number), otherwise request threads simply queue on checking out a
  # connection instead of on a thread — same stall, harder to spot.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 8 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "hr_platform_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "hr_platform_test") %>

# In production/staging, either set DATABASE_URL directly (Rails merges it
# automatically on top of the values below), or provide the same DATABASE_*
# vars used above via the deployment platform's secret/env management —
# never committed to source control.
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "hr_platform_production") %>
