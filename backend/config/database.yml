default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST") %>
  port: <%= ENV.fetch("DATABASE_PORT") %>
  username: <%= ENV.fetch("DATABASE_USER") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") %>
  # Must stay >= Puma's thread count (config/puma.rb reads the same
  # RAILS_MAX_THREADS), otherwise request threads simply queue on checking out
  # a connection instead of on a thread — same stall, harder to spot.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") %>

# In production/staging, either set DATABASE_URL directly (Rails merges it
# automatically on top of the values below), or provide the same DATABASE_*
# vars used above via the deployment platform's secret/env management —
# never committed to source control.
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") %>
