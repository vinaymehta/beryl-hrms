test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage — MinIO in development/staging (via
# docker-compose), real AWS S3 or Cloudflare R2 in production, selected
# purely through the S3_* env vars (same config, different endpoint).
# S3_FORCE_PATH_STYLE=true is required for MinIO/R2; unset for AWS S3.
s3_compatible:
  service: S3
  access_key_id: <%= ENV.fetch("S3_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("S3_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "hr-platform-storage") %>
  endpoint: <%= ENV["S3_ENDPOINT"].presence %>
  force_path_style: <%= ActiveModel::Type::Boolean.new.cast(ENV["S3_FORCE_PATH_STYLE"]) %>

# Remember not to checkin your GCS keyfile to a repository
