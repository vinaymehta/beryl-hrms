# NOTE: this file is read ONCE, by the Sidekiq startup hook in
# config/initializers/sidekiq.rb. Adding or changing an entry here has no
# effect on an already-running Sidekiq — restart it, or the new job simply
# never registers and silently never runs.

cleanup_expired_sessions:
  cron: "0 * * * *" # hourly
  class: "CleanupExpiredSessionsJob"

zoho_token_refresh:
  cron: "*/5 * * * *" # every 5 minutes
  class: "ZohoTokenRefreshJob"

zoho_auto_scan:
  # Every 2 minutes: this is the worst-case delay between a mail arriving
  # and its resumes being picked up. Each tick enqueues one
  # ZohoMailboxScanJob per connected mailbox, so mailboxes scan in parallel.
  # Overlapping ticks are safe — that job takes a per-mailbox Redis lock and
  # a tick that finds one held just skips that mailbox.
  cron: "*/2 * * * *"
  class: "ZohoAutoScanJob"

appraisal_reminders:
  # Daily, early. The only appraisal notifications that depend on the calendar
  # rather than on somebody acting — see AppraisalRemindersJob.
  cron: "0 7 * * *"
  class: "AppraisalRemindersJob"
